{% extends 'base.html' %}
{% block title %}Change Password — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:480px;">
  <div class="card p-4 p-md-5 reveal">
    <h4 style="font-weight:800;margin-bottom:1.5rem;"><i class="fas fa-lock me-2 text-primary"></i>Change Password</h4>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label class="form-label">Current Password</label><input type="password" name="old_password" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">New Password</label><input type="password" name="new_password1" class="form-control" required></div>
      <div class="mb-4"><label class="form-label">Confirm New Password</label><input type="password" name="new_password2" class="form-control" required></div>
      <button type="submit" class="btn btn-primary btn-lg w-100"><i class="fas fa-key me-2"></i>Update Password</button>
    </form>
    <div class="text-center mt-3"><a href="/accounts/profile/" style="font-size:.875rem;color:var(--text-muted);">← Back to Profile</a></div>
  </div>
</div>
{% endblock %}
