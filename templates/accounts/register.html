{% extends 'base.html' %}
{% block title %}Create Account — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:560px;">
  <div class="text-center mb-4 reveal-scale">
    <div style="width:72px;height:72px;background:var(--grad-primary);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto .85rem;box-shadow:var(--shadow-glow);">
      <i class="fas fa-user-plus" style="font-size:2rem;color:#fff;"></i>
    </div>
    <h2 style="font-weight:800;color:var(--text);">Create Account</h2>
    <p style="color:var(--text-muted);">Join <strong>{{ SITE_NAME }}</strong> and start shopping</p>
  </div>
  <div class="card p-4 p-md-5 reveal">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-6"><label class="form-label">First Name</label><input type="text" name="first_name" class="form-control" placeholder="John"></div>
        <div class="col-6"><label class="form-label">Last Name</label><input type="text" name="last_name" class="form-control" placeholder="Doe"></div>
        <div class="col-12"><label class="form-label">Username *</label><input type="text" name="username" class="form-control" required placeholder="Choose a unique username"></div>
        <div class="col-12"><label class="form-label">Email Address *</label><input type="email" name="email" class="form-control" required placeholder="you@example.com"></div>
        <div class="col-12"><label class="form-label">Password *</label><input type="password" name="password1" class="form-control" required placeholder="Minimum 8 characters"></div>
        <div class="col-12"><label class="form-label">Confirm Password *</label><input type="password" name="password2" class="form-control" required placeholder="Repeat your password"></div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100 mt-4 btn-shimmer">
        <i class="fas fa-user-plus me-2"></i>Create My Account
      </button>
    </form>
    <div class="text-center mt-3" style="font-size:.875rem;">
      <span style="color:var(--text-muted);">Already have an account?</span>
      <a href="/accounts/login/" style="font-weight:700;margin-left:.35rem;">Sign in →</a>
    </div>
  </div>
</div>
{% endblock %}
