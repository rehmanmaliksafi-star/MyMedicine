{% extends 'base.html' %}
{% block title %}Login — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:460px;">
  <div class="text-center mb-4 reveal-scale">
    <div style="width:72px;height:72px;background:var(--grad-primary);border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto .85rem;box-shadow:var(--shadow-glow);animation:float 3s ease-in-out infinite;">
      <i class="fas fa-prescription-bottle-medical" style="font-size:2rem;color:#fff;"></i>
    </div>
    <h2 style="font-weight:800;color:var(--text);">Welcome Back</h2>
    <p style="color:var(--text-muted);">Sign in to your <strong>{{ SITE_NAME }}</strong> account</p>
  </div>
  <div class="card p-4 p-md-5 reveal">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text" style="border-right:none;"><i class="fas fa-user" style="color:var(--primary);"></i></span>
          <input type="text" name="username" class="form-control" style="border-left:none;" placeholder="Enter your username" required autofocus>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text" style="border-right:none;"><i class="fas fa-lock" style="color:var(--primary);"></i></span>
          <input type="password" name="password" class="form-control" style="border-left:none;border-right:none;" placeholder="Enter your password" required id="passInput">
          <button type="button" class="input-group-text" style="cursor:pointer;border-left:none;" onclick="const i=document.getElementById('passInput');i.type=i.type==='password'?'text':'password';this.querySelector('i').className=i.type==='password'?'fas fa-eye':'fas fa-eye-slash';" title="Toggle password"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-100 btn-shimmer">
        <i class="fas fa-sign-in-alt me-2"></i>Sign In
      </button>
    </form>
    <div class="text-center mt-4" style="font-size:.875rem;">
      <span style="color:var(--text-muted);">Don't have an account?</span>
      <a href="/accounts/register/" style="font-weight:700;margin-left:.35rem;">Create one →</a>
    </div>
  </div>
</div>
{% endblock %}
