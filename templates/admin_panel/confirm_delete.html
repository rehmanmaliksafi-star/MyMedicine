{% extends 'base.html' %}
{% block title %}Confirm Delete — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="container my-5" style="max-width:480px;"><div class="card p-5 text-center reveal-scale"><div style="width:80px;height:80px;background:rgba(244,67,54,.1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.25rem;"><i class="fas fa-exclamation-triangle fa-2x text-danger"></i></div><h4 style="font-weight:800;">Confirm Delete</h4><p style="color:var(--text-muted);margin:.5rem 0 1.5rem;">Are you sure you want to delete <strong>"{{ item_name }}"</strong>? This action cannot be undone.</p><form method="post" class="d-flex gap-2 justify-content-center">{% csrf_token %}<button type="submit" class="btn btn-danger px-4"><i class="fas fa-trash me-2"></i>Delete</button><a href="/dashboard/{% if back_url == 'promo_management' %}promo-images/{% elif back_url == 'banner_management' %}banners/{% else %}{% endif %}" class="btn btn-outline-secondary px-4">Cancel</a></form></div></div>
{% endblock %}
