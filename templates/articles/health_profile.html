{% extends 'base.html' %}
{% block title %}Health Profile — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="page-header"><div class="container"><h1><i class="fas fa-heart me-2"></i>My Health Profile</h1><p>Personalize your pharmacy experience</p></div></div>
<div class="container mb-5" style="max-width:620px;">
  <div class="card p-4 p-md-5 reveal">
    <form method="post">{% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Age</label><input type="number" name="age" class="form-control" value="{{ profile.age|default:'' }}" min="1" max="120" placeholder="Your age"></div>
        <div class="col-md-6"><label class="form-label">Gender</label><select name="gender" class="form-select"><option value="">-- Select --</option><option value="male" {% if profile.gender == 'male' %}selected{% endif %}>Male</option><option value="female" {% if profile.gender == 'female' %}selected{% endif %}>Female</option><option value="other" {% if profile.gender == 'other' %}selected{% endif %}>Other</option></select></div>
        <div class="col-12"><label class="form-label">Medical Conditions</label><textarea name="medical_conditions" class="form-control" rows="2" placeholder="Diabetes, Hypertension, Asthma…">{{ profile.medical_conditions }}</textarea></div>
        <div class="col-12"><label class="form-label">Known Allergies</label><textarea name="allergies" class="form-control" rows="2" placeholder="Penicillin, Aspirin, Shellfish…">{{ profile.allergies }}</textarea></div>
      </div>
      <div class="alert mt-3" style="background:var(--primary-50);border-left:4px solid var(--primary);font-size:.85rem;"><i class="fas fa-lock me-2 text-primary"></i>Your health info is private and used only to personalize recommendations.</div>
      <button type="submit" class="btn btn-primary btn-lg w-100 mt-3 btn-shimmer"><i class="fas fa-save me-2"></i>Save Health Profile</button>
    </form>
  </div>
</div>
{% endblock %}
